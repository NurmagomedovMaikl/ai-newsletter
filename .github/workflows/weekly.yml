name: Weekly Pipeline

# Kompletter automatischer Wochen-Workflow:
#   1. Recherche + Scoring + Inhalte + Assets + QA (pipeline/run_weekly.ts)
#   2. Veröffentlichung (--publish) — nur wenn QA bestanden
#   3. E-Mail-Versand über die deployte App (/api/send-weekly, idempotent)
#   4. Bei Fehlern: Admin-Benachrichtigung via Resend
#
# Option A (Vercel Cron, Fallback-Sender) läuft zusätzlich in vercel.json.

on:
  schedule:
    # Montag 04:45 UTC (06:45 MEZ) — vor dem Vercel-Cron-Send um 06:00 UTC
    - cron: "45 4 * * 1"
  workflow_dispatch: # manueller Trigger (GitHub → Actions → Run workflow)

permissions:
  contents: read

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: .env aus Secrets erzeugen
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}
          GOOGLE_FACTCHECK_API_KEY=${{ secrets.GOOGLE_FACTCHECK_API_KEY }}
          EOF

      - name: Weekly-Pipeline (collect → score → generate → assets → qa → persist)
        run: npm run pipeline:weekly -- --auto-fix --publish

      - name: E-Mail-Versand anstoßen (deployte App)
        if: success()
        run: |
          curl -fsS -X POST "https://${{ secrets.NEWSLETTER_APP_URL }}/api/send-weekly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Fehler-Notification an Admin (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$ADMIN_EMAIL" ]; then
            curl -fsS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"from\":\"$NEWSLETTER_FROM_EMAIL\",\"to\":\"$ADMIN_EMAIL\",\"subject\":\"AI Newsletter: Weekly-Pipeline fehlgeschlagen\",\"text\":\"Die Weekly-Pipeline ist fehlgeschlagen. Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "Resend-Notifikation übersprungen (RESEND_API_KEY/ADMIN_EMAIL fehlt)."
          fi
